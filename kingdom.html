<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مملكتي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0f1530;--fg:#fff;--card:#1b2350;--ac:#8b7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:6px;padding:6px;font-size:13px;flex-wrap:wrap}
#hud span,button{background:var(--card);border-radius:10px;padding:6px 9px;border:0;color:var(--fg);font-size:13px}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:6px}
#chop{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);right:14px;width:74px;height:74px;border-radius:50%;background:#6b4f2a;font-size:15px}
#quest{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:6px;right:6px;font-size:13px;background:#0008;padding:6px 10px;border-radius:10px}
#modal,#login{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}
.box{background:var(--card);border-radius:14px;padding:14px;width:min(88vw,340px);max-height:80vh;overflow:auto}
.box button{display:block;width:100%;margin:6px 0;background:var(--ac)}
input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:0;margin:5px 0;font-size:15px}
h3{margin:4px 0 8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="r"></span></div>
<div id="quest"></div>
<button id="chop">🪓 قطع</button>
<div id="bar"><button onclick="openM('shop')">🛒 المتجر</button><button onclick="openM('build')">🏗️ بناء</button><button onclick="openM('store')">📦 المخزن</button></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div class="box" id="mb"></div></div>
<div id="login" style="display:flex"><div class="box"><h3>👑 مملكتي</h3>
<input id="nm" placeholder="اسم اللاعب" maxlength="14">
<input id="code" placeholder="كود العالم (للانضمام)" maxlength="6" style="text-transform:uppercase">
<button onclick="start(false)">انضمام لعالم</button><button onclick="start(true)">إنشاء عالم جديد</button>
<div style="font-size:11px;opacity:.7">ملاحظة: اللعب الجماعي الفعلي يحتاج خادم (سيرفر) — هذه نسخة تجريبية فردية.</div></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();onresize=rs;
const T=32,N=50;let S,code,name,P,trees=[],bl=[],ws=[],t0=0,keys={},joy=null,cam={x:0,y:0};
const STORE={x:25*T,y:25*T},MINE={x:34*T,y:14*T};
const COST={house:{n:'🏠 بيت',w:10,s:0,c:0},big:{n:'🏡 بيت كبير',w:30,s:10,c:0},castle:{n:'🏰 قلعة',w:80,s:60,c:0},kingdom:{n:'👑 مملكة',w:200,s:150,c:100}};
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function start(newW){name=document.getElementById('nm').value||'لاعب';
 code=newW?Math.random().toString(36).slice(2,8).toUpperCase():(document.getElementById('code').value.toUpperCase()||'ABC123');
 let seed=0;for(const ch of code)seed=seed*31+ch.charCodeAt(0);seed=seed%2147483000+1;const R=rnd(seed);
 trees=[];for(let i=0;i<260;i++){const x=Math.floor(R()*N),y=Math.floor(R()*N);if(Math.hypot(x-25,y-25)<4||Math.hypot(x-34,y-14)<3)continue;trees.push({x:x*T+16,y:y*T+16,hp:3,t:0,by:null,s:.8+R()*.4})}
 S={wood:0,stone:0,coins:0,q:0};bl=[];ws=[];
 try{const d=JSON.parse(localStorage.getItem('w_'+code)||'null');if(d){S=d.S;bl=d.bl;ws=d.ws}}catch(e){}
 ws.forEach(w=>{w.by=null;w.st='idle'});
 P={x:STORE.x+40,y:STORE.y+40,pack:0,ch:0,face:1,mv:0};
 document.getElementById('login').style.display='none';msg('كود عالمك: '+code+' — شاركه مع أصدقائك');}
function save(){try{localStorage.setItem('w_'+code,JSON.stringify({S,bl,ws}))}catch(e){}}
setInterval(()=>S&&save(),5000);
let mt=0,mtxt='';function msg(s){mtxt=s;mt=240}
function near(a,b,d){return Math.hypot(a.x-b.x,a.y-b.y)<d}
// input
onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;
cv.addEventListener('pointerdown',e=>{joy={sx:e.clientX,sy:e.clientY,dx:0,dy:0,id:e.pointerId}});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id==e.pointerId){let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}joy.dx=dx/m;joy.dy=dy/m}});
cv.addEventListener('pointerup',()=>joy=null);
document.getElementById('chop').onclick=()=>P&&(P.ch=1);
function chopT(){let b=null,bd=48;for(const t of trees)if(t.hp>0){const d=Math.hypot(t.x-P.x,t.y-P.y);if(d<bd){bd=d;b=t}}return b}
// modals
function openM(k){const m=document.getElementById('mb');let h='';
 if(k=='shop'){h=`<h3>🛒 المتجر</h3><button onclick="sell('wood')">بيع كل الخشب (${S.wood}) ← ${S.wood*2}🪙</button><button onclick="sell('stone')">بيع كل الحجر (${S.stone}) ← ${S.stone*3}🪙</button><button onclick="hire('wood')">👷 استأجر حطّاب — 20🪙</button><button onclick="hire('mine')">⛏️ استأجر عامل منجم — 40🪙</button><div>عمالك: ${ws.length}</div>`}
 if(k=='build'){h='<h3>🏗️ بناء (بجانب شخصيتك)</h3>';for(const id in COST){const c=COST[id];h+=`<button onclick="build('${id}')">${c.n} — 🪵${c.w} 🪨${c.s} 🪙${c.c}</button>`}}
 if(k=='store'){h=`<h3>📦 المخزن</h3><div>🪵 خشب: ${S.wood}</div><div>🪨 حجر: ${S.stone}</div><div>🪙 عملات: ${S.coins}</div><div>🏘️ مباني: ${bl.length}</div>`}
 m.innerHTML=h;document.getElementById('modal').style.display='flex'}
function sell(k){S.coins+=S[k]*(k=='wood'?2:3);S[k]=0;if(S.q==1&&0)0;openM('shop')}
function hire(k){const c=k=='wood'?20:40;if(S.coins<c){msg('عملات غير كافية');return}S.coins-=c;
 ws.push({x:STORE.x,y:STORE.y+30,k,st:'idle',by:null,carry:0,t:0,col:k=='wood'?'#c33':'#39c'});openM('shop')}
function build(id){const c=COST[id];if(S.wood<c.w||S.stone<c.s||S.coins<c.c){msg('الموارد غير كافية');return}
 S.wood-=c.w;S.stone-=c.s;S.coins-=c.c;bl.push({id,x:Math.round((P.x+(P.face*60))/T)*T,y:Math.round((P.y-30)/T)*T});
 document.getElementById('modal').style.display='none';msg('تم البناء!')}
// update
function upd(){if(!S)return;let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
 if(joy){dx+=joy.dx;dy+=joy.dy}const l=Math.hypot(dx,dy);P.mv=l>.1;
 if(l>.1){if(l>1){dx/=l;dy/=l}P.x=Math.max(10,Math.min(N*T-10,P.x+dx*2.6));P.y=Math.max(10,Math.min(N*T-10,P.y+dy*2.6));if(Math.abs(dx)>.2)P.face=dx>0?1:-1}
 if(keys[' '])P.ch=1;
 if(P.ch){P.ch=0;const t=chopT();if(t){t.hp--;P.sw=10;if(t.hp<=0){t.t=1800;P.pack+=3;msg('+3 خشب 🪵')}}else msg('اقترب من شجرة')}
 if(P.sw>0)P.sw--;
 if(near(P,STORE,70)&&P.pack){S.wood+=P.pack;P.pack=0}
 for(const t of trees)if(t.hp<=0&&--t.t<=0){t.hp=3;t.by=null}
 for(const w of ws){
  if(w.k=='wood'){
   if(w.st=='idle'){let b=null,bd=1e9;for(const t of trees)if(t.hp>0&&!t.by){const d=Math.hypot(t.x-w.x,t.y-w.y);if(d<bd){bd=d;b=t}}if(b){b.by=w;w.tg=b;w.st='go'}}
   else if(w.st=='go'){if(w.tg.hp<=0){w.st='idle';continue}mv(w,w.tg,1.4,()=>{w.st='cut';w.t=90})}
   else if(w.st=='cut'){if(--w.t<=0){w.tg.hp=0;w.tg.t=1800;w.tg.by=null;w.carry=3;w.st='back'}}
   else if(w.st=='back')mv(w,STORE,1.4,()=>{S.wood+=w.carry;w.carry=0;w.st='idle'});
  }else{
   if(w.st=='idle')w.st='go';
   if(w.st=='go')mv(w,MINE,1.2,()=>{w.st='down';w.t=240});
   else if(w.st=='down'){if(--w.t<=0){w.carry=2;w.st='back'}}
   else if(w.st=='back')mv(w,STORE,1.2,()=>{S.stone+=w.carry;w.carry=0;w.st='idle'});
  }}
 // quests
 const Q=['اجمع 10 خشب (اقترب من شجرة واضغط 🪓)','ابنِ بيتك الأول من قائمة البناء','بِع خشباً واستأجر أول عامل من المتجر','عامل منجم يجلب الحجر — ابنِ قلعة ثم مملكة!'];
 if(S.q==0&&S.wood>=10)S.q=1;if(S.q==1&&bl.length)S.q=2;if(S.q==2&&ws.length)S.q=3;
 document.getElementById('quest').textContent='📜 المهمة: '+Q[S.q];
 document.getElementById('r').textContent=`🪵${S.wood}  🪨${S.stone}  🪙${S.coins}  | حقيبة ${P.pack} | عالم ${code}`;
 cam.x=P.x-W/2;cam.y=P.y-H/2}
function mv(w,t,sp,cb){const d=Math.hypot(t.x-w.x,t.y-w.y);if(d<8)return cb();w.x+=(t.x-w.x)/d*sp;w.y+=(t.y-w.y)/d*sp}
// draw
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function person(x,y,o){const b=o.mv?Math.sin(t0*.3)*2:0;
 R(x-8,y+6,7,10,'#1d1535');R(x+1,y+6,7,10+b*0,'#1d1535');R(x-8,y+14,7,3,'#cbb8ff');R(x+1,y+14,7,3,'#cbb8ff');
 R(x-9,y-6,18,13,'#2a1f4d');R(x-9,y+2,18,2,'#d9d0ff');
 R(x-13,y-5,4,11,'#33265c');R(x+9,y-5,4,11,'#33265c');R(x-13,y+4,4,2,'#fff');R(x+9,y+4,4,2,'#fff');
 R(x-8,y-18,16,13,'#f1e0d6');R(x-5,y-12,3,3,'#f2c716');R(x+2,y-12,3,3,'#f2c716');
 R(x-11,y-24,22,8,'#9fd0ff');R(x-11,y-18,4,18,'#9fd0ff');R(x+7,y-18,4,18,'#9fd0ff');R(x-11,y-6,4,5,'#a98bff');R(x+7,y-6,4,5,'#a98bff');R(x-4,y-20,10,4,'#bfe3ff')}
function bld(b){const x=b.x,y=b.y;
 if(b.id=='house'){R(x-14,y-8,28,22,'#a5703a');R(x-18,y-18,36,12,'#b23a3a');R(x-4,y+2,8,12,'#4a2c12')}
 if(b.id=='big'){R(x-22,y-10,44,26,'#b98544');R(x-26,y-24,52,15,'#8d2f2f');R(x-8,y+2,10,14,'#4a2c12');R(x+8,y-4,8,8,'#8fd3ff')}
 if(b.id=='castle'){R(x-34,y-30,68,50,'#8a8fa0');for(let i=0;i<5;i++)R(x-34+i*15,y-38,9,8,'#8a8fa0');R(x-10,y,20,20,'#3b2a1a');R(x-42,y-44,14,64,'#a0a5b5');R(x+28,y-44,14,64,'#a0a5b5');R(x-42,y-52,14,8,'#c33');R(x+28,y-52,14,8,'#c33')}
 if(b.id=='kingdom'){R(x-60,y-34,120,58,'#9a9fb0');for(let i=0;i<8;i++)R(x-60+i*16,y-42,10,8,'#9a9fb0');for(const dx of[-70,-20,40]){R(x+dx,y-70,26,94,'#b3b8c8');R(x+dx,y-82,26,12,'#d4a017')}R(x-12,y-6,24,30,'#3b2a1a')}}
function tree(t){const s=t.s;if(t.hp<=0){R(t.x-3,t.y+6,6,4,'#6b4a25');return}R(t.x-4,t.y-2,8,16,'#6b4a25');
 g.fillStyle='#2f7a3a';g.fillRect(t.x-16*s,t.y-22*s,32*s,22*s);g.fillStyle='#3b9448';g.fillRect(t.x-11*s,t.y-30*s,22*s,12*s)}
function draw(){t0++;g.fillStyle='#4aa04a';g.fillRect(0,0,W,H);if(!S){requestAnimationFrame(draw);return}
 g.save();g.translate(-Math.round(cam.x),-Math.round(cam.y));
 const x0=Math.max(0,Math.floor(cam.x/T)),y0=Math.max(0,Math.floor(cam.y/T));
 for(let i=x0;i<Math.min(N,x0+W/T+2);i++)for(let j=y0;j<Math.min(N,y0+H/T+2);j++)if((i*7+j*13)%5==0)R(i*T+8,j*T+10,4,4,'#3f8f3f');
 R(0,0,N*T,4,'#222');R(0,N*T-4,N*T,4,'#222');
 // storage
 R(STORE.x-22,STORE.y-14,44,30,'#7a5a2e');R(STORE.x-26,STORE.y-24,52,12,'#444');R(STORE.x-6,STORE.y+2,12,14,'#2c1c0a');
 // mine
 R(MINE.x-26,MINE.y-20,52,40,'#666');R(MINE.x-12,MINE.y-6,24,26,'#111');R(MINE.x-26,MINE.y-30,52,10,'#8a5a2a');
 const items=[];trees.forEach(t=>items.push({y:t.y,f:()=>tree(t)}));bl.forEach(b=>items.push({y:b.y+10,f:()=>bld(b)}));
 ws.forEach(w=>{if(w.st!='down')items.push({y:w.y,f:()=>{person2(w)}})});items.push({y:P.y,f:()=>{person(P.x,P.y,P);if(P.sw>0)R(P.x+P.face*14,P.y-4-P.sw%4*3,8,3,'#ddd');if(P.pack)R(P.x-4,P.y-34,8,5,'#6b4a25')}});
 items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
 g.restore();
 g.fillStyle='#fff';g.font='bold 13px sans-serif';g.textAlign='center';g.fillText(name,W/2,H/2-40);
 if(mt>0){mt--;g.fillStyle='#000a';g.fillRect(W/2-130,H-130,260,28);g.fillStyle='#fff';g.fillText(mtxt,W/2,H-111)}
 if(joy){g.strokeStyle='#fff6';g.lineWidth=3;g.beginPath();g.arc(joy.sx,joy.sy,50,0,7);g.stroke();g.fillStyle='#fff5';g.beginPath();g.arc(joy.sx+joy.dx*50,joy.sy+joy.dy*50,20,0,7);g.fill()}
 requestAnimationFrame(draw)}
function person2(w){const x=w.x,y=w.y;R(x-6,y-14,12,10,'#f1e0d6');R(x-7,y-18,14,5,w.k=='wood'?'#5a3a1a':'#f2c716');R(x-7,y-4,14,12,w.col);R(x-6,y+8,5,6,'#222');R(x+1,y+8,5,6,'#222');if(w.carry)R(x-4,y-24,8,5,w.k=='wood'?'#6b4a25':'#999')}
function loop(){upd();setTimeout(loop,1000/60)}
loop();requestAnimationFrame(draw);
</script></body></html>
